resources:
  jobs:
    transform_gold:
      name: transform_gold

      trigger:
        periodic:
          interval: 1
          unit: DAYS

      parameters:
        - name: catalog
          default: ${var.catalog}

      tasks:
        - task_key: transform
          notebook_task:
            notebook_path: ../src/module_12_framework/gold_layer/gold.py
          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies: ${var.package_dependencies}
