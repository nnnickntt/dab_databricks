bundle:
  name: dabs_workshop

include:
  - resources/*.yml

variables:
  catalog:
  root_path:
    default: /Workspace/Users/nicknicknuttiwut@gmail.com/.bundle/${bundle.name}/${bundle.target}
  package_dependencies:
    description: "Python dependencies for job environments"
    default: []

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-1833bb51-da33.cloud.databricks.com
      root_path: ${var.root_path}
    variables:
      catalog: dev

  prod:
    mode: production
    workspace:
      host: https://dbc-1833bb51-da33.cloud.databricks.com
      root_path: ${var.root_path}
    artifacts:
      default:
        type: whl
        build: python3 -m build
        path: ./logic_packages/
    variables:
      catalog: prod

      package_dependencies:
        - ./logic_packages/dist/*.whl